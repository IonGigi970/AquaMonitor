name: Scraper avarii RAJA

on:
  schedule:
    # Rezerva de siguranta: GitHub intarzie/sare frecvent rulari programate ("schedule"),
    # mai ales la intervale scurte. Declansarea principala, la interval fix, vine de la
    # un serviciu extern (cron-job.org) care apeleaza /api/cron/trigger-scraper si
    # porneste acest workflow prin workflow_dispatch (prioritate normala, fara intarzieri).
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Configureaza Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instaleaza dependente
        run: pip install -r requirements.txt

      - name: Ruleaza scraper-ul
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scraper.py
