name: Scraper avarii RAJA

on:
  # Declansarea vine doar de la un serviciu extern (cron-job.org) care apeleaza
  # /api/cron/trigger-scraper si porneste acest workflow prin workflow_dispatch.
  # Trigger-ul "schedule" a fost eliminat: rula in paralel cu cel extern si
  # dubla consumul de minute Actions (repo privat, cota lunara limitata).
  workflow_dispatch:
    inputs:
      notificare_test_abonament:
        description: "ID-ul abonamentului care primeste o notificare de test (optional). Daca e gol, ruleaza scanarea normala."
        required: false
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Configureaza Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instaleaza dependente
        run: pip install -r requirements.txt

      - name: Ruleaza scraper-ul
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -n "${{ inputs.notificare_test_abonament }}" ]; then
            echo "Mod test: trimit notificare de test catre abonamentul ${{ inputs.notificare_test_abonament }}"
            python scraper.py --test-notificare "${{ inputs.notificare_test_abonament }}"
          else
            python scraper.py
          fi
