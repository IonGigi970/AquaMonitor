[tool.ruff]
# Aceleași reguli ca în verificările rulate manual (pyflakes + importuri).
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "F",   # pyflakes: nume nedefinite, importuri nefolosite
    "E",   # pycodestyle: erori de stil
    "W",   # pycodestyle: avertismente
    "I",   # isort: ordinea importurilor
    "UP",  # pyupgrade: sintaxă modernă
]

[tool.ruff.lint.per-file-ignores]
# Fișierele din pachet folosesc importuri relative scurte, ordonate manual.
"aquamonitor/**" = ["E501"]
